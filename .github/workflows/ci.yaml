name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      batch:
        description: Approved batch to render and stage
        required: true
        default: none
        type: choice
        options: [none, launch-six, next-six, viral-ten]
      render_launch:
        description: Legacy launch-six shortcut (leave false when selecting a batch)
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: astral-sh/setup-uv@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: uv sync

      - name: Install sidecar dependencies
        working-directory: satori-service
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy --strict src

      - name: Test
        run: uv run pytest -x -q

      - name: Test and typecheck sidecar
        working-directory: satori-service
        run: pnpm test && pnpm build

  batch:
    name: Render batches
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.render_launch == true || (inputs.batch != '' && inputs.batch != 'none'))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: astral-sh/setup-uv@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: uv sync

      - name: Select approved batch
        id: selected
        env:
          SELECTED_BATCH: ${{ inputs.batch }}
          RENDER_LAUNCH: ${{ inputs.render_launch }}
        run: |
          selected="$SELECTED_BATCH"
          if [[ "$RENDER_LAUNCH" == "true" ]]; then
            if [[ -n "$selected" && "$selected" != "none" && "$selected" != "launch-six" ]]; then
              echo "::error::Choose a batch or the legacy launch shortcut, not both"
              exit 1
            fi
            selected=launch-six
          fi
          case "$selected" in
            launch-six|next-six|viral-ten) ;;
            *) echo "::error::Unknown release batch"; exit 1 ;;
          esac
          echo "name=$selected" >> "$GITHUB_OUTPUT"

      - name: Verify release credentials
        env:
          D1_URL: ${{ secrets.D1_URL }}
          D1_TOKEN: ${{ secrets.D1_TOKEN }}
        run: |
          if [[ -z "$D1_URL" ]]; then
            echo "::error::Missing GitHub Actions secret D1_URL"
            exit 1
          fi
          if [[ -z "$D1_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret D1_TOKEN"
            exit 1
          fi
          if [[ "$D1_URL" != *"/accounts/"* ]]; then
            echo "::error::D1_URL does not contain a Cloudflare account path; Workers AI account ID cannot be inferred"
            exit 1
          fi

      - name: Verify approved stories and current D1 data
        env:
          BATCH_NAME: ${{ steps.selected.outputs.name }}
          D1_URL: ${{ secrets.D1_URL }}
          D1_TOKEN: ${{ secrets.D1_TOKEN }}
        run: uv run python -m scripts.verify_batch_data "batches/$BATCH_NAME.yaml"

      - name: Install satori-service deps
        working-directory: satori-service
        run: pnpm install --frozen-lockfile

      - name: Start satori sidecar
        working-directory: satori-service
        run: pnpm exec tsx src/server.ts &
        env:
          PORT: "3001"

      - name: Wait for satori
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3001/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3001/health || { echo "satori sidecar failed to start"; exit 1; }

      - name: Render verified batch
        run: uv run python scripts/render_story_batch.py "batches/$BATCH_NAME.yaml"
        env:
          BATCH_NAME: ${{ steps.selected.outputs.name }}
          SATORI_URL: "http://localhost:3001"
          D1_URL: ${{ secrets.D1_URL }}
          D1_TOKEN: ${{ secrets.D1_TOKEN }}

      - name: Upload rendered videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ steps.selected.outputs.name }}-${{ github.sha }}
          path: out/
          retention-days: 90
          if-no-files-found: warn

      - name: Stage verified release
        if: success()
        env:
          BATCH_NAME: ${{ steps.selected.outputs.name }}
        run: uv run python -m nobodynamed_video.release "out/$BATCH_NAME.summary.json" out/release

      - name: Upload verified release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.selected.outputs.name }}-release-${{ github.sha }}
          path: out/release/
          retention-days: 90
          if-no-files-found: error

      - name: Publish verified release to videos branch
        if: success()
        env:
          RELEASE_SHA: ${{ github.sha }}
          BATCH_NAME: ${{ steps.selected.outputs.name }}
        run: uv run python -m nobodynamed_video.publish_release out/release "$RELEASE_SHA" "$BATCH_NAME"

      - name: Summary
        if: always()
        run: |
          echo "## Batch render" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Video | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          for f in out/*.mp4; do
            echo "| $(basename "$f" .mp4) | $(du -h "$f" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
