name: Candidate D1 Snapshots

on:
  push:
    branches: [main]
    paths:
      - research/promoted-six-2025.yaml
      - data/ssa-2025/**
      - .github/workflows/candidate-snapshots.yaml
      - scripts/snapshot_from_d1.py
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Verify D1 credentials
        env:
          D1_URL: ${{ secrets.D1_URL }}
          D1_TOKEN: ${{ secrets.D1_TOKEN }}
        run: |
          if [[ -z "$D1_URL" ]]; then
            echo "::error::Missing GitHub Actions secret D1_URL"
            exit 1
          fi
          if [[ -z "$D1_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret D1_TOKEN"
            exit 1
          fi

      - name: Verify D1 mirror and extract promoted snapshots
        env:
          D1_URL: ${{ secrets.D1_URL }}
          D1_TOKEN: ${{ secrets.D1_TOKEN }}
        run: |
          uv run python scripts/snapshot_from_d1.py \
            --year 2025 \
            --archive-sha256 cd78e975ed7bb358e018dd62fbe14ced89295e9581c49172ca4eedcb011b3724 \
            --anchor-dir data/ssa-2025 \
            --out out/candidate-snapshots \
            --names Rihanna:F Miley:F Aaliyah:F Elsa:F Leia:F Atlas:M

      - name: Show provenance
        run: cat out/candidate-snapshots/provenance.json

      - name: Upload candidate snapshots
        uses: actions/upload-artifact@v4
        with:
          name: candidate-snapshots-${{ github.sha }}
          path: out/candidate-snapshots/
          retention-days: 30
          if-no-files-found: error
