story_kind: long_decline
thesis: Destiny was the most 2000s name imaginable — aspirational, bold, and unmistakably
  of its era. It has fallen more than 90% since its peak.
headline: The most 2000s name ever.
subhead: '10,000 Destinys at peak. Now: 640.'
takeaway: A top-25 name in 2000, the sound of an era's optimism. Now nearly extinct.
support: Rose through the 1990s, peaked at the millennium, then a 24-year fall.
script_beats:
  - kind: hook
    text: This was the most two-thousands name imaginable.
  - kind: reveal
    text: Destiny peaked at 10,000 births in 2000.
  - kind: proof
    text: By 2024, only 643 girls were named Destiny.
  - kind: loop
    text: Watch a millennium dream fade to almost nothing.
