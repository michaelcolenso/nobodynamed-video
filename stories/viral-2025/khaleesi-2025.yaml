id: khaleesi-2025
name: Khaleesi
sex: F
story_kind: cultural_rupture
thesis: Khaleesi first appears in 2011, peaked at 565 girls in 2018, fell 29 percent
  the year after the finale, and still returned 410 births in 2025.
headline: This name did not exist before 2011.
subhead: 565 girls in 2018. 410 in 2025.
takeaway: The finale cost it a third, not its life.
support: Down 29 percent the year after the ending.
